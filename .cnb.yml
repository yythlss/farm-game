# ============================================================
# AI 种田经营游戏 · CNB 流水线
#
#   include     从中心 CI 仓库引入作品自动化检查流水线（$.pull_request.target）
#               检查逻辑集中在中心仓库维护，作品侧不要改写
#   $.vscode    云原生开发环境 + 仅预览模式：点右上角「🌾 开始游戏」直接拉起
#               业务容器并打开游戏页面，无需进 WebIDE、无需任何配置
#   main.push   推送到 main 时自动构建并推送镜像到 CNB 制品库
#               ⚠️ 首次点「开始游戏」之前必须先推一次 main，确保镜像已构建推送
#                  否则 launch 拉不到镜像，预览页会一直打不开
#
# 端口约定：作品容器内必须监听 0.0.0.0:8686（由中心 CI 的 APP_PORT 固定）
#          本地/开发环境调试请用 PORT=8080 python app.py
# ============================================================

# ---- 作品自动化检查流水线（从中心 CI 仓库引入）----
include:
  - https://cnb.cool/whut1/ai-engineering-exercise-ci/-/blob/main/hackathon.yml

$:
  # ---------------- 云原生开发环境 ----------------
  vscode:
    - runner:
        cpus: 16
      docker:
        image: docker.cnb.cool/hackathon/vibegame-dev-env:latest
      services:
        # 字符串形式的 vscode 不能省：官方 Schema 通过「services 中是否存在字符串 vscode」
        # 判定这是云原生开发配置（pipeline 定义的 if/then/else 分支）。
        # 只写下面的对象形式会被判成普通流水线，进而要求必填 stages 导致校验失败。
        - vscode
        - docker
        # 对象形式用于挂载 options，开启仅预览模式
        - name: vscode
          options:
            # 仅预览模式：点「🌾 开始游戏」直接打开游戏页面，而不是进 WebIDE
            # 平台会每 10 秒探测一次容器内 8686 端口（最多约 200 秒），就绪后才打开预览页
            onlyPreview: true
            # 启动业务服务。这里跑 main.push 推送到制品库的业务镜像，
            # 并用 --network host 让容器直接监听宿主 8686（平台只暴露这个端口）。
            # 透传 CNB_* 变量，使容器内的 AI 事件生成能调用平台大模型（零密钥）；
            # 变量只写名不写值，由开发环境容器自动传入，不落盘、不进镜像。
            launch: docker run -d --rm --network host -e PORT=8686 -e CNB_API_ENDPOINT -e CNB_REPO_SLUG -e CNB_TOKEN ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest
            # 保活 1 小时：超过该时长检测不到 HTTP 心跳即自动回收环境
            keepAliveTimeout: 3600000
            # 后台执行，无需等待 launch 退出
            daemon: true

main:
  # ---------------- 推送主分支：自动构建并推送镜像 ----------------
  push:
    - name: 构建并推送镜像
      services:
        - docker
      stages:
        - name: build-and-push
          script: |
            set -e
            docker build -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest .
            docker push ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest
            echo "✅ 镜像已推送，可配合「仅预览模式」一键启动"
